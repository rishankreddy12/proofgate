name: ci
on:
  push:
  pull_request:
  workflow_call:

permissions: {}

env:
  GOTOOLCHAIN: local

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bash scripts/tests/test_check_pinned_actions.sh && bash scripts/check_pinned_actions.sh .
      - run: make guard

  test:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go mod verify
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@971e284b6050e8a5849174e72974d18386cf5c44 # v6.1.1
        with:
          version: v1.61
      - run: go test -race ./...
      - run: go test -race -tags integration ./...
      - run: go run ./cmd/benchreport -check
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.3 ./...

  image:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: docker build -f deploy/Dockerfile -t proofgate:ci .
      - run: bash scripts/check_image.sh proofgate:ci
      - uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with: {image-ref: "proofgate:ci", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1"}

  e2e:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Start services and build gateway
        run: |
          mkdir -p deploy/secrets
          go run ./cmd/proofgatectl kek generate > deploy/secrets/local_kek.b64
          docker compose -f deploy/docker-compose.yml up -d --build --wait
      - name: Run E2E, Security and SDK test suite
        run: |
          bash scripts/e2e_security_setup.sh
          go test -race -tags e2e -count=1 ./e2e/...
          bash scripts/sdk_smoke.sh
      - name: Teardown
        if: always()
        run: docker compose -f deploy/docker-compose.yml down -v

  first-run:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: bash scripts/first_run_test.sh
      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb99ba811e # v4.5.1
        with:
          name: first-run-results
          path: bench/results/first-run.json

  perf-gate:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Benchmark PR branch
        run: go test -bench=. -benchmem -count=5 -run=^$ ./internal/sse/... ./internal/guard/... > /tmp/pr.txt
      - name: Benchmark main branch
        run: |
          git stash
          git checkout origin/main -- .
          go test -bench=. -benchmem -count=5 -run=^$ ./internal/sse/... ./internal/guard/... > /tmp/main.txt || true
          git checkout -
          git stash pop || true
      - name: Compare with benchstat
        run: |
          echo "=== Benchmark comparison ==="
          benchstat /tmp/main.txt /tmp/pr.txt | tee /tmp/benchstat.txt
          # Fail on >10% regression in any benchmark
          if grep -qE '\+[1-9][0-9]\.[0-9]+%' /tmp/benchstat.txt; then
            echo "::error::Significant performance regression detected (>10%)"
            exit 1
          fi
          echo "✅ No significant regressions detected."

  fuzz-seed:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run fuzz tests with seed corpus
        run: |
          go test -fuzz=FuzzReader -fuzztime=10s ./internal/sse/...
          go test -fuzz=FuzzParse -fuzztime=10s ./internal/mcpproxy/...
          go test -fuzz=FuzzRedactRestore -fuzztime=10s ./internal/guard/...
          go test -fuzz=FuzzParse -fuzztime=10s ./internal/config/...
          go test -fuzz=FuzzMergeMessage -fuzztime=10s ./internal/health/...
