name: ci
on:
  push:
  pull_request:
  workflow_call:

permissions: {}

env:
  GOTOOLCHAIN: local

jobs:
  guard:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: bash scripts/check_pinned_actions.sh .
      - run: make guard

  build:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@f111f3307d8850f501ac008e886eec1fd1932a34 # v5.3.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod tidy && git diff --exit-code go.mod go.sum
      - run: go mod verify
      - run: go vet ./...
      - run: go build ./...
      - uses: golangci/golangci-lint-action@971e284b6050e8a5849b72094c50ab08da042db8 # v6.1.1
        with:
          version: v1.61
      - run: go run golang.org/x/vuln/cmd/govulncheck@v1.1.3 ./...

  image:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f deploy/Dockerfile -t proofgate:ci .
      - run: bash scripts/check_image.sh proofgate:ci
      - uses: aquasecurity/trivy-action@18f2510ee396bbf400402947b394f2dd8c87dbb0 # v0.29.0
        with: {image-ref: "proofgate:ci", severity: "HIGH,CRITICAL", ignore-unfixed: true, exit-code: "1"}
