name: chart
on:
  push:
    paths:
      - "deploy/helm/**"
      - ".github/workflows/chart.yml"
  pull_request:
    paths:
      - "deploy/helm/**"
      - ".github/workflows/chart.yml"
  schedule:
    - cron: "0 4 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@b7246b12e77f0c801b62971f25f466aaac72b83f # v4.2.0
        with:
          version: v3.15.4
      - name: Lint chart
        run: helm lint deploy/helm/proofgate
      - name: Run helm-unittest
        run: |
          helm plugin install https://github.com/helm-unittest/helm-unittest.git
          helm unittest deploy/helm/proofgate
      - name: Validate templates with kubeconform
        run: |
          curl -sL https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz | tar xz
          sudo mv kubeconform /usr/local/bin/
          helm template proofgate deploy/helm/proofgate | kubeconform -strict -summary

  install-kind:
    needs: lint-and-test
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: azure/setup-helm@b7246b12e77f0c801b62971f25f466aaac72b83f # v4.2.0
        with:
          version: v3.15.4
      - uses: helm/kind-action@a1b0e391336a6ee67134bb59c8d362f9f441fbc6 # v1.12.0
        with:
          cluster_name: proofgate-ci
      - name: Build and load images
        run: |
          docker build -t proofgate:ci -f deploy/Dockerfile .
          docker build -t proofgate-mock:ci -f deploy/Dockerfile.mockllm .
          kind load docker-image proofgate:ci --name proofgate-ci
          kind load docker-image proofgate-mock:ci --name proofgate-ci
      - name: Deploy dependencies
        run: |
          kubectl apply -f deploy/helm/ci/postgres.yaml
          kubectl apply -f deploy/helm/ci/redis.yaml
          kubectl apply -f deploy/helm/ci/clickhouse.yaml
          kubectl apply -f deploy/helm/ci/mock.yaml
          kubectl rollout status deployment/postgres --timeout=120s
          kubectl rollout status deployment/redis --timeout=120s
          kubectl rollout status deployment/clickhouse --timeout=120s
          kubectl rollout status deployment/mockllm --timeout=120s
      - name: Create local KEK secret
        run: |
          KEK=$(head -c 32 /dev/urandom | base64)
          kubectl create secret generic proofgate-kek --from-literal=local_kek="$KEK"
      - name: Install ProofGate chart
        run: |
          helm install proofgate deploy/helm/proofgate \
            -f deploy/helm/ci/kind-values.yaml \
            --set secrets.localKek.existingSecret=proofgate-kek \
            --wait --timeout 5m
      - name: Verify gateway readiness and smoke test
        run: |
          POD=$(kubectl get pods -l app.kubernetes.io/name=proofgate -o jsonpath="{.items[0].metadata.name}")
          kubectl exec "$POD" -- /usr/local/bin/proofgatectl tenant create --name demo
          KEY=$(kubectl exec "$POD" -- /usr/local/bin/proofgatectl key create --tenant demo --name smoke)
          kubectl run curl-test --rm -i --restart=Never --image=curlimages/curl -- \
            curl -fsS http://proofgate:8080/v1/chat/completions \
            -H "Authorization: Bearer $KEY" \
            -H "Content-Type: application/json" \
            -d '{"model":"default","messages":[{"role":"user","content":"hello"}]}'
      - name: Uninstall chart
        run: helm uninstall proofgate
