name: release
on:
  push:
    tags: ["v*"]
permissions: {}
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # GitHub release assets
      packages: write        # GHCR push with GITHUB_TOKEN (no long-lived registry secret)
      id-token: write        # OIDC for keyless cosign and attestations
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/proofgate
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: {go-version: "1.23"}
      - uses: docker/setup-buildx-action@b5ca514318bd6ebac0fb2aedd5d36ec1b5c232a2 # v3.10.0
      - uses: docker/login-action@9780b0c442fbb1117ed29e0efdff1e18412f7567 # v3.3.0
        with: {registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}"}
      - id: build
        uses: docker/build-push-action@471d1dc4e07e5cdedd4c2171150001c434f0b7a4 # v6.15.0
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.IMAGE }}:${{ github.ref_name }}
          build-args: VERSION=${{ github.ref_name }}
      - uses: sigstore/cosign-installer@d7d6bc7722e3ea1f7384f53f47d54429b0b23048 # v3.8.1
      - run: cosign sign --yes "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: anchore/sbom-action@f325610c9f50a54015d37c8d16cb3b0e2c8f4de0 # v0.17.9
        with: {image: "${{ env.IMAGE }}@${{ steps.build.outputs.digest }}", format: spdx-json, output-file: sbom.spdx.json}
      - run: cosign attest --yes --type spdxjson --predicate sbom.spdx.json "${IMAGE}@${{ steps.build.outputs.digest }}"
      - uses: actions/attest-build-provenance@c074443f1a5fb4aee83904b71181049aa88b20e5 # v2.2.3
        with: {subject-name: "${{ env.IMAGE }}", subject-digest: "${{ steps.build.outputs.digest }}", push-to-registry: true}
      - run: |
          for os in linux darwin; do for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=$os GOARCH=$arch go build -trimpath -ldflags "-s -w -X github.com/proofgate/proofgate/internal/version.Version=${GITHUB_REF_NAME}" \
              -o dist/proofgate-$os-$arch ./cmd/proofgate
          done; done
          (cd dist && sha256sum * > SHA256SUMS)
      - run: gh release create "$GITHUB_REF_NAME" dist/* sbom.spdx.json --generate-notes
        env: {GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"}
