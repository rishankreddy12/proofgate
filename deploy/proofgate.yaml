# Example configuration. Model ids and prices are examples: copy current values from each provider's
# pricing page before using this for cost numbers. Prices are USD per 1M tokens.
server:
  addr: ":8080"
  admin_addr: "0.0.0.0:9090"   # inside the container only; do not publish this port publicly
  max_request_body_bytes: 10485760 # 10MB
  read_header_timeout: 10s
  idle_timeout: 120s
  drain_timeout: 30s

admin_auth:
  enabled: true
  max_login_attempts: 5
  lockout_duration: 15m
  session_idle_timeout: 30m
  session_absolute_timeout: 12h

# Persistent state (defaults to DATABASE_URL if omitted)
database:
  max_conns: 20

# Analytics & event queues (defaults to CLICKHOUSE_DSN if omitted)
analytics:
  usage_batcher:
    capacity: 50000
    batch_size: 5000
    flush_interval: 1s
  mcp_batcher:
    capacity: 20000
    batch_size: 2000
    flush_interval: 1s
  flush_timeout: 10s

# Circuit breaker failure isolation
breakers:
  threshold: 5
  cooldown: 30s

# In-memory authentication key caching
auth:
  cache_ttl: 30s
  negative_cache_ttl: 5s
  max_cached_keys: 100000

# Global MCP proxy limits
mcp:
  max_request_body_bytes: 4194304 # 4MB

secrets:
  kek: local
  local_kek_file: /run/secrets/local_kek

providers:
  - {name: mock-a, type: openai, base_url: "http://mockllm-a:8081/v1", api_key_db: true}
  - {name: mock-b, type: openai, base_url: "http://mockllm-b:8081/v1", api_key_db: true}
  - {name: mock-bench, type: openai, base_url: "http://mockllm-bench:8081/v1"}
  - {name: openai, type: openai, base_url: "https://api.openai.com/v1", api_key_env: OPENAI_API_KEY}
  - {name: anthropic, type: anthropic, base_url: "https://api.anthropic.com", api_key_env: ANTHROPIC_API_KEY}
  - {name: gemini, type: gemini, base_url: "https://generativelanguage.googleapis.com", api_key_env: GEMINI_API_KEY}
  - {name: ollama, type: openai, base_url: "http://ollama:11434/v1"}
  # Local EasyCLIProxyAPI running on Windows host (OpenAI-compatible format)
  - {name: easycli, type: openai, base_url: "http://host.docker.internal:8317/v1", api_key_env: EASYCLI_API_KEY}

pricing:
  mock-a/mock-small:   {input: 0.10, output: 0.40}
  mock-b/mock-large:   {input: 1.00, output: 4.00}
  mock-a/mock-embed:   {input: 0.02, output: 0}
  mock-bench/mock-small: {input: 0.10, output: 0.40}
  # Local proxy models at $20
  easycli/gemini-3-flash:         {input: 20.00, output: 20.00}
  easycli/gemini-3.7-flash-high:  {input: 20.00, output: 20.00}
  easycli/claude-sonnet-4-6:      {input: 20.00, output: 20.00}
  easycli/claude-opus-4-6-thinking: {input: 20.00, output: 20.00}

routes:
  - name: default
    targets:
      - {provider: easycli, model: gemini-3-flash}
      - {provider: easycli, model: claude-sonnet-4-6}
      # --- Original Mock LLM targets (uncomment whenever you want to switch back to mock LLMs) ---
      # - {provider: mock-a, model: mock-small}
      # - {provider: mock-b, model: mock-large}
    hedge: {enabled: true, max_extra: 0.1}
    cache:
      mode: on
      exact: true
      semantic: true
      threshold: 0.85
      embedding_route: embed
      ttl: 24h
  # Dedicated routes for EasyCLIProxyAPI models:
  - name: claude
    targets:
      - {provider: easycli, model: claude-sonnet-4-6}
      - {provider: easycli, model: claude-opus-4-6-thinking}
    retry:
      max_attempts: 3
      base_delay: 1s
    cache:
      mode: on
      exact: true
      semantic: true
      threshold: 0.85
      embedding_route: embed
      ttl: 24h
  - name: gemini
    targets:
      - {provider: easycli, model: gemini-3-flash}
    cache:
      mode: on
      exact: true
      semantic: true
      threshold: 0.85
      embedding_route: embed
      ttl: 24h
  # Common Cursor model aliases:
  - name: auto
    targets:
      - {provider: easycli, model: claude-sonnet-4-6}
      - {provider: easycli, model: gemini-3-flash}
    cache:
      mode: on
      exact: true
      semantic: true
      threshold: 0.85
      embedding_route: embed
      ttl: 24h
  - name: claude-3-5-sonnet-20241022
    targets:
      - {provider: easycli, model: claude-sonnet-4-6}
      - {provider: easycli, model: gemini-3.7-flash-high}
    cache:
      mode: on
      exact: true
      semantic: true
      threshold: 0.85
      embedding_route: embed
      ttl: 24h
  - name: claude-3-5-sonnet
    targets:
      - {provider: easycli, model: claude-sonnet-4-6}
      - {provider: easycli, model: gemini-3.7-flash-high}
    cache:
      mode: on
      exact: true
      semantic: true
      threshold: 0.85
      embedding_route: embed
      ttl: 24h
  - name: claude-3.5-sonnet
    targets:
      - {provider: easycli, model: claude-sonnet-4-6}
      - {provider: easycli, model: gemini-3.7-flash-high}
    cache:
      mode: on
      exact: true
      semantic: true
      threshold: 0.85
      embedding_route: embed
      ttl: 24h
  - name: gpt-4o
    targets:
      - {provider: easycli, model: claude-sonnet-4-6}
      - {provider: easycli, model: gemini-3-flash}
    cache:
      mode: on
      exact: true
      semantic: true
      threshold: 0.85
      embedding_route: embed
      ttl: 24h
  - name: gpt-4o-mini
    targets:
      - {provider: easycli, model: gemini-3-flash}
    cache:
      mode: on
      exact: true
      semantic: true
      threshold: 0.85
      embedding_route: embed
      ttl: 24h
  - name: cursor-small
    targets:
      - {provider: easycli, model: gemini-3-flash}
    cache:
      mode: on
      exact: true
      semantic: true
      threshold: 0.85
      embedding_route: embed
      ttl: 24h
  - name: bench
    targets:
      - {provider: mock-bench, model: mock-small}
    cache:
      mode: "off"
  - name: faq
    targets:
      - {provider: mock-a, model: mock-small}
      - {provider: mock-b, model: mock-large}
    cache:
      mode: on
      exact: true
      semantic: true
      threshold: 0.95
      embedding_route: embed
      ttl: 24h
  - name: embed
    embeddings: true
    targets:
      - {provider: mock-a, model: mock-embed}

slos:
  mock-a/mock-small: {ttft_ms: 800, max_error_rate: 0.2}
  mock-b/mock-large: {ttft_ms: 800, max_error_rate: 0.2}

health:
  alpha: 0.3
  breaches: 3
  recover: 30s
  min_samples: 10
  probe_interval: 5s
