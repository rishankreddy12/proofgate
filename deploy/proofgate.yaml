# Example configuration for local quickstart with mock LLMs and reference providers.
# Model IDs and prices are examples: verify against each provider's current pricing page
# before using this configuration in production. Prices are USD per 1M tokens.

server:
  addr: ":8080"
  admin_addr: "127.0.0.1:9090"
  max_request_body_bytes: 10485760 # 10MB
  read_header_timeout: 10s
  idle_timeout: 120s
  drain_timeout: 30s

admin_auth:
  enabled: true
  max_login_attempts: 5
  lockout_duration: 15m
  session_idle_timeout: 30m
  session_absolute_timeout: 12h

database:
  max_conns: 20

analytics:
  usage_batcher:
    capacity: 50000
    batch_size: 5000
    flush_interval: 1s
  mcp_batcher:
    capacity: 20000
    batch_size: 2000
    flush_interval: 1s
  flush_timeout: 10s

breakers:
  threshold: 5
  cooldown: 30s

auth:
  cache_ttl: 30s
  negative_cache_ttl: 5s
  max_cached_keys: 100000

mcp:
  max_request_body_bytes: 4194304 # 4MB

secrets:
  kek: local
  local_kek_file: /run/secrets/local_kek

providers:
  - {name: mock-a, type: openai, base_url: "http://mockllm-a:8081/v1", api_key_db: true}
  - {name: mock-b, type: openai, base_url: "http://mockllm-b:8081/v1", api_key_db: true}
  - {name: mock-bench, type: openai, base_url: "http://mockllm-bench:8081/v1"}
  - {name: openai, type: openai, base_url: "https://api.openai.com/v1", api_key_env: OPENAI_API_KEY}
  - {name: anthropic, type: anthropic, base_url: "https://api.anthropic.com", api_key_env: ANTHROPIC_API_KEY}
  - {name: gemini, type: gemini, base_url: "https://generativelanguage.googleapis.com", api_key_env: GEMINI_API_KEY}
  - {name: ollama, type: openai, base_url: "http://ollama:11434/v1"}

pricing:
  # Mock LLM pricing for zero-key local quickstart and tests:
  mock-a/mock-small:       {input: 0.10, output: 0.40}
  mock-b/mock-large:       {input: 1.00, output: 4.00}
  mock-a/mock-embed:       {input: 0.02, output: 0.00}
  mock-bench/mock-small:   {input: 0.10, output: 0.40}

  # Production providers (verify against provider price page):
  openai/gpt-4o:           {input: 2.50, output: 10.00, cached_input: 1.25}
  openai/gpt-4o-mini:      {input: 0.15, output: 0.60, cached_input: 0.075}
  anthropic/claude-3-5-sonnet: {input: 3.00, output: 15.00}
  gemini/gemini-1.5-pro:   {input: 3.50, output: 10.50}
  gemini/gemini-1.5-flash: {input: 0.075, output: 0.30}

budget:
  reserve: strict
  require_pricing: true

proof:
  min_threshold: 0.86

routes:
  - name: default
    targets:
      - {provider: mock-a, model: mock-small}
      - {provider: mock-b, model: mock-large}
    hedge: {enabled: true, max_extra: 0.1}
    cache:
      mode: shadow
      exact: true
      semantic: true
      threshold: 0.90
      embedding_route: embed
      ttl: 24h

  - name: bench
    targets:
      - {provider: mock-bench, model: mock-small}
    cache:
      mode: "off"

  - name: faq
    targets:
      - {provider: mock-a, model: mock-small}
      - {provider: mock-b, model: mock-large}
    cache:
      mode: shadow
      exact: true
      semantic: true
      threshold: 0.95
      embedding_route: embed
      ttl: 24h

  - name: embed
    embeddings: true
    targets:
      - {provider: mock-a, model: mock-embed}

slos:
  mock-a/mock-small: {ttft_ms: 800, max_error_rate: 0.2}
  mock-b/mock-large: {ttft_ms: 800, max_error_rate: 0.2}

health:
  alpha: 0.3
  breaches: 3
  recover: 30s
  min_samples: 10
  probe_interval: 5s
