name: proofgate
x-gateway: &gateway
  build: {context: .., dockerfile: deploy/Dockerfile}
  read_only: true
  tmpfs: [/tmp]
  user: "65532:65532"
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  secrets: [local_kek]
  environment:
    DATABASE_URL: postgres://proofgate:proofgate@postgres:5432/proofgate?sslmode=disable
    REDIS_URL: redis://redis:6379/0
    CLICKHOUSE_DSN: clickhouse://proofgate:proofgate@clickhouse:9000/proofgate
    OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  volumes:
    - ./proofgate.yaml:/etc/proofgate/proofgate.yaml:ro
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
    clickhouse: {condition: service_healthy}
    mockllm-a: {condition: service_started}
    mockllm-b: {condition: service_started}
  healthcheck:
    test: ["CMD", "/usr/local/bin/proofgate", "-healthcheck"]
    interval: 2s
    retries: 30

services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: proofgate, POSTGRES_PASSWORD: proofgate, POSTGRES_DB: proofgate}
    ports: ["127.0.0.1:15432:5432"]
    healthcheck: {test: ["CMD-SHELL", "pg_isready -U proofgate"], interval: 2s, retries: 30}
  redis:
    image: redis/redis-stack-server:7.4.0-v1
    ports: ["127.0.0.1:16379:6379"]
    healthcheck: {test: ["CMD", "redis-cli", "ping"], interval: 2s, retries: 30}
  mockllm-a:
    build: {context: .., dockerfile: deploy/Dockerfile.mockllm}
    command: ["-name", "a", "-addr", ":8081"]
    ports: ["127.0.0.1:18081:8081"]
  mockllm-b:
    build: {context: .., dockerfile: deploy/Dockerfile.mockllm}
    command: ["-name", "b", "-addr", ":8081"]
    ports: ["127.0.0.1:18082:8081"]
  gateway-1:
    <<: *gateway
    ports: ["18080:8080", "127.0.0.1:19090:9090"]
  gateway-2:
    <<: *gateway
    ports: ["18083:8080", "127.0.0.1:19091:9090"]
  gateway-3:
    <<: *gateway
    ports: ["18084:8080", "127.0.0.1:19092:9090"]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_DB: proofgate
      CLICKHOUSE_USER: proofgate
      CLICKHOUSE_PASSWORD: proofgate
    ports: ["127.0.0.1:19000:9000", "127.0.0.1:18123:8123"]
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1:8123/ping || exit 1"]
      interval: 2s
      retries: 30

  prometheus:
    image: prom/prometheus:v2.54.1
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["127.0.0.1:19099:9090"]

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: "Admin"
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
      GF_INSTALL_PLUGINS: "grafana-clickhouse-datasource"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:13000:3000"]
    depends_on:
      - prometheus
      - clickhouse

secrets:
  local_kek:
    file: ./secrets/local_kek.b64

