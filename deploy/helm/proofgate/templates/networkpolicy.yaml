{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "proofgate.fullname" . }}
  labels:
    {{- include "proofgate.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "proofgate.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        {{- if .Values.networkPolicy.ingressFrom }}
        {{- toYaml .Values.networkPolicy.ingressFrom | nindent 8 }}
        {{- else }}
        - namespaceSelector: {}
        {{- end }}
      ports:
        - protocol: TCP
          port: 8080
    - ports:
        - protocol: TCP
          port: 9090
  egress:
    - ports:
        - protocol: UDP
          port: {{ .Values.networkPolicy.dnsPort | default 53 }}
        - protocol: TCP
          port: {{ .Values.networkPolicy.dnsPort | default 53 }}
    {{- if .Values.networkPolicy.egressCIDRs }}
    - to:
        {{- range .Values.networkPolicy.egressCIDRs }}
        - ipBlock:
            cidr: {{ . }}
        {{- end }}
    {{- end }}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
{{- end }}
