apiVersion: apps/v1
kind: Deployment
metadata:
  name: clickhouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8-alpine
          env:
            - name: CLICKHOUSE_DB
              value: proofgate
            - name: CLICKHOUSE_USER
              value: proofgate
            - name: CLICKHOUSE_PASSWORD
              value: proofgate
          ports:
            - containerPort: 9000
            - containerPort: 8123
---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
spec:
  ports:
    - port: 9000
      name: native
    - port: 8123
      name: http
  selector:
    app: clickhouse
