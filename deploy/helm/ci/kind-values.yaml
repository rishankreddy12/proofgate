replicaCount: 1

image:
  repository: proofgate
  tag: ci
  pullPolicy: Never

resources:
  limits:
    cpu: 500m
    memory: 512Mi
  requests:
    cpu: 100m
    memory: 128Mi

networkPolicy:
  enabled: false

pdb:
  enabled: false

config: |
  server:
    addr: ":8080"
    admin_addr: "0.0.0.0:9090"
  secrets:
    kek: local
    local_kek_file: /run/secrets/local_kek
  database:
    url: postgres://proofgate:proofgate@postgres:5432/proofgate?sslmode=disable
  redis:
    url: redis://redis:6379/0
  analytics:
    clickhouse_dsn: clickhouse://proofgate:proofgate@clickhouse:9000/proofgate
  providers:
    - name: mock
      type: openai
      base_url: "http://mockllm.default.svc.cluster.local:8081/v1"
  routes:
    - name: default
      targets:
        - provider: mock
          model: mock-small
      cache:
        mode: "off"
